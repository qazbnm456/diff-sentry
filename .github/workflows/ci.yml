name: CI

# Offline suite only: no live LLM, no network calls in tests, no Deno sandbox — dspy-bearing paths use
# DummyLM / rlm-kit's ScriptedInterpreter, transports are injected fakes, and the corpus pins the
# indicator suite's hit/miss behavior (see CLAUDE.md "Verify"). `uv sync` pulls rlm-kit from GitHub
# (uv.lock pins the exact commit).
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only checks out code and runs tests/lint — it never writes. Specifying
# `permissions:` also drops every unlisted scope to `none`, so a compromised dep/action on an untrusted
# fork PR can't use the token to push, tag, or open issues.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 3.11 is the requires-python floor; 3.13 is what .python-version / local dev actually runs.
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        # Third-party action pinned to a commit SHA for supply-chain integrity (a moving major tag
        # could be repointed at malicious code that runs with this workflow's token). GitHub-owned
        # actions (checkout) stay on a major tag. Bump the SHA and the trailing version comment together.
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      # --all-packages brings in the studio workspace member, --all-extras every optional surface
      # (classify/observe/subscription + the studio dev extra) so both suites resolve in one env.
      - name: Sync (core + studio workspace)
        run: uv sync --all-extras --all-packages --python ${{ matrix.python-version }}

      - name: Core tests (pipeline + wiring)
        run: uv run --python ${{ matrix.python-version }} python -m pytest

      - name: Studio console tests
        run: uv run --python ${{ matrix.python-version }} python -m pytest studio/tests

      # The eval workspace member (diff-sentry-eval) — its OWN offline suite: the reward-free ATLAS
      # scorecard, stub judge, synthetic traces, no creds. `--all-packages` above already installed it.
      - name: Eval scorecard tests
        run: uv run --package diff-sentry-eval --python ${{ matrix.python-version }} python -m pytest eval/tests

      # The studio frontend's pure/factory cores (run-core, replay-core, trajectory) carry assert-based
      # node tests; the ubuntu runner ships node, so gate them here too.
      - name: Frontend core unit tests (node)
        run: |
          for f in studio/tests/*.test.js; do echo "▸ $f"; node "$f"; done

  # Dogfood: run our OWN deterministic detector over the change this CI run is reviewing.
  #
  # DELIBERATELY the `scan` subcommand and not `pr`/`classify`. The full pipeline needs DS_* model
  # creds, and the only mechanism that hands creds to a fork PR's run is `pull_request_target` — which
  # is precisely the misconfiguration that opened the AsyncAPI "Miasma" compromise (a fork PR executing
  # in a privileged context, harvesting the runner's token). `scan` is pure-Python with no creds, no
  # network and no Deno, so it runs happily under the workflow's read-only `contents: read` token.
  # NO fork guard here, also deliberately: this job is read-only with no side effects outside its own
  # repo, so a fork running it is correct and useful (contrast the guarded jobs in awesome-web-security
  # and rlm-kit's release.yml, which write or publish).
  self-scan:
    name: self-scan (dogfood)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # need the base commit to diff against

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      # Event data goes through `env:`, never interpolated into the `run:` body — a `${{ github.event.* }}`
      # expanded straight into a shell script is the classic Actions script-injection sink.
      - name: Derive the change under review
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$BASE_SHA"; else base="${BEFORE_SHA:-}"; fi
          # A branch's first push reports an all-zero `before`; fall back to the parent commit.
          case "$base" in ''|0000000000000000000000000000000000000000) base="$(git rev-parse HEAD~1)" ;; esac
          echo "base=$base head=$(git rev-parse HEAD)"

          # The change splits in two, because this is a DETECTOR repo: some of our files carry attack
          # patterns as their JOB (the rule bodies, the planner prompt, the attack skills, the test
          # fixtures, the eval taskset, and the docs that tabulate all of the above). Scanning those
          # against our own rules is a guaranteed self-hit — verified: the `curl … | bash` in
          # detect.INSTRUCTIONS and the `${IFS}` in README's pipeline table both fire `critical`/`high`.
          # So they are reported but not gated, and everything else — the actual machinery plus the
          # build/CI/dependency surface where a supply-chain payload would really land — IS gated.
          # Checked against all 32 commits of history: zero false gate failures.
          git diff "$base...HEAD" -- . \
            ':(exclude)diff_sentry/indicators.py' \
            ':(exclude)diff_sentry/detect.py' \
            ':(exclude)diff_sentry/skills/**' \
            ':(exclude)tests/**' ':(exclude)eval/tests/**' ':(exclude)studio/tests/**' \
            ':(exclude)eval/taskset.example.json' ':(exclude)eval/diff_sentry_eval/taskset.py' \
            ':(exclude)*.md' > "$RUNNER_TEMP/gated.diff"
          git diff "$base...HEAD" -- \
            diff_sentry/indicators.py diff_sentry/detect.py 'diff_sentry/skills/**' \
            'tests/**' 'eval/tests/**' 'studio/tests/**' \
            eval/taskset.example.json eval/diff_sentry_eval/taskset.py '*.md' \
            > "$RUNNER_TEMP/pattern-bearing.diff"
          wc -l "$RUNNER_TEMP/gated.diff" "$RUNNER_TEMP/pattern-bearing.diff"

      - name: Scan the machinery + supply-chain surface (GATING)
        run: uv run python -m diff_sentry scan "$RUNNER_TEMP/gated.diff"

      # Reported in the log, never blocking — so the blind spot above is explicit rather than silent.
      # `|| true` rather than `continue-on-error:` on purpose: this surface fires on nearly every docs
      # or fixture change, and a step that is permanently yellow just teaches everyone to ignore it.
      # Teaching the suite to tell "prose describing a pattern" from "the pattern itself" would remove
      # the need for this split; until then a human reads this block when reviewing the PR.
      - name: Scan the pattern-bearing surface (report only, never gates)
        run: |
          echo "::group::pattern-bearing surface (rules, prompt, skills, fixtures, docs)"
          uv run python -m diff_sentry scan "$RUNNER_TEMP/pattern-bearing.diff" || true
          echo "::endgroup::"

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Lint
        # PINNED on purpose. `uvx ruff` resolves the latest release at run time, and ruff's DEFAULT
        # rule set is not a stable contract — 0.16 expanded it far past the pycodestyle/pyflakes
        # baseline, which would have turned this job red on the next push with no code change. Bump
        # it deliberately, with the resulting fixes in the same commit, rather than letting a
        # release do it for you.
        run: uvx ruff@0.16.0 check .
