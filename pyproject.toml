[project]
name = "diff-sentry"
version = "0.3.0"
description = "Catch malicious pull requests before they merge: scan a diff for supply-chain attack patterns with deterministic evidence a model cannot suppress."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Boik Su" }]
keywords = ["rlm", "dspy", "security", "malicious-code-detection", "supply-chain-security", "prompt-injection", "siem"]
dependencies = [
    # rlm-kit is consumed via a git source until it ships on PyPI (see [tool.uv.sources]).
    "rlm-kit",
    "pydantic>=2.0",
    "httpx>=0.27",      # the GitHub-allowlisted enrichment fetcher + the host-side SIEM emitter
]

# The console entry point. `python -m diff_sentry` still works and is what the repo's own docs use for
# local runs, but a `diff-sentry` command is what makes the tool installable-and-runnable in one step
# (`uvx diff-sentry scan …`) — which is how the GitHub Action invokes it.
[project.scripts]
diff-sentry = "diff_sentry.cli:main"

[project.optional-dependencies]
# The swappable second-stage classifier's default `self` backend talks an OpenAI-compatible API.
classify = ["openai>=1.0"]
observe = ["langfuse>=4.6.1", "openinference-instrumentation-dspy>=0.1.36"]
# Run planner + analyst on a Claude Pro/Max subscription (DS_ROOT_LM / DS_SUB_LM =
# `claude-agent-sdk/<id>`) via rlm-kit's `rlm_kit.ClaudeAgentLM`. Installs the Claude Agent SDK the
# adapter needs; also needs the Claude Code CLI installed + logged in — a runtime prerequisite pip
# can't express (see .env.example).
subscription = ["claude-agent-sdk>=0.1.60"]

# Bare `uv sync` (and `--all-packages`) default-installs the `subscription-sdk` dev group (below) so the
# Claude Agent SDK isn't pruned from the shared dev venv — an EXTRA is not synced by default, so a
# `uv sync` without `--extra subscription` PRUNES it and a subscription dev run then crashes (ClaudeAgentLM
# ImportError). `dev` MUST stay listed — default-groups REPLACES uv's `["dev"]` default, it doesn't append.
# The public pip extra above is unchanged. Opt out for one sync: `uv sync --no-group subscription-sdk`.
[tool.uv]
default-groups = ["dev", "subscription-sdk"]

# rlm-kit is public but not yet on PyPI, so it comes in via git (uv.lock pins the exact commit); swap to
# a version spec once it ships on PyPI. The dogfooding loop rlm-kit is designed around still holds: when
# co-developing rlm-kit locally, overlay an editable install (`uv pip install -e ../rlm-kit`) or bump
# this ref after pushing, so a fix that surfaces here can be promoted into the kit.
[tool.uv.sources]
rlm-kit = { git = "https://github.com/qazbnm456/rlm-kit.git", branch = "main" }

# The in-repo workspace members — each its OWN package, NOT part of the `diff_sentry` wheel:
#   studio/ — the visualization console (fastapi/uvicorn/frontend, behind its `live` extra);
#   eval/   — the offline, reward-free LLM-as-judge scorecard (a one-way trace reader).
# Both read this package's trace/DetectionResponse contract, so co-locating keeps them in sync. The
# external git source (rlm-kit) lives here at the workspace root and applies to every member.
[tool.uv.workspace]
members = ["studio", "eval"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
# A dev-group MIRROR of the `subscription` optional-dependency extra (kept above for the pip surface),
# default-installed via `[tool.uv] default-groups` so a bare `uv sync` doesn't prune the Claude Agent SDK.
subscription-sdk = ["claude-agent-sdk>=0.1.60"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

# ruff's DEFAULT rule set is not a stable contract — 0.16 expanded it far past the
# pycodestyle/pyflakes baseline, which is why CI pins the version. The handful of default rules that
# fight this project's design are ignored BY NAME here, with the reason.
#
# Deliberately no `select` list: curating one is a real policy decision, and this codebase leans on
# lazy imports (keeping modules SDK-free, deferring optional extras) that a broader selection would
# immediately argue with.
#
# `S110`/`BLE001` are deliberately NOT here. A best-effort swallow IS the design at several
# boundaries — but every such site already carries a `# noqa` naming why, which is more precise than
# a blanket ignore and keeps a NEW one from arriving unexamined.
[tool.ruff.lint]
ignore = [
    # `__all__` is grouped by concern (config/schema, scan, normalize, assemble, response, emit),
    # which tells a reader the package's shape. Alphabetical order would lose that.
    "RUF022",
    # Would swap ValueError for TypeError at two taskset validation sites. That is a PUBLIC
    # behaviour change — callers and tests catch ValueError — bought for a lint preference.
    "TRY004",
]

[tool.ruff.lint.per-file-ignores]
# Test idiom, not debt: a mutable class attribute on a throwaway fixture needs no `ClassVar`, and a
# `subprocess.run` whose exit code the test asserts on itself does not want `check=True` (it would
# raise before the assertion that reports WHY it failed).
"tests/**" = ["RUF012", "S101", "PLW1510"]
"eval/tests/**" = ["RUF012", "S101", "PLW1510"]
"studio/tests/**" = ["RUF012", "S101", "PLW1510"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` ships every file under the package dir — the skills/*.md ride along automatically. (A
# redundant force-include of those same paths duplicates them and breaks the wheel build.)
packages = ["diff_sentry"]
